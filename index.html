<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محامي - محمد هشام</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #c9d1d9;
            --gold-color: #c5a059;
            --text-color: #f0f6fc;
            --whatsapp-green: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            overflow-x: hidden;
        }

        /* خلفية الشعار الشفافة (علامة مائية) */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 350px;
            height: 350px;
            background-image: url('./logo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* اللوجو الأساسي في أعلى الصفحة */
        .main-logo {
            width: 180px;
            height: auto;
            max-width: 80%;
            object-fit: contain;
        }

        /* زر التواصل عبر الواتساب */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--whatsapp-green);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 300px;
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }

        .whatsapp-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اللوجو الرئيسي -->
        <img src="./logo.png" alt="محمد هشام - محامي" class="main-logo">

        <!-- زر الاتصال بالواتساب -->
        <a href="https://wa.me/" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
            <svg class="whatsapp-icon" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.754zm6.097-4.901l.438.26c1.511.896 3.25 1.368 5.021 1.369 5.385 0 9.766-4.381 9.768-9.767.001-2.608-1.014-5.059-2.859-6.905-1.846-1.846-4.298-2.86-6.906-2.86-5.386 0-9.767 4.381-9.769 9.768 0 1.838.514 3.63 1.488 5.183l.286.457-1.006 3.677 3.539-.922z"/>
            </svg>
            تواصل عبر الواتساب
        </a>
    </div>

</body>
</html>
