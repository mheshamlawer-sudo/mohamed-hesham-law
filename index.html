<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محامي - محمد هشام</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #05070a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* اللوجو الرئيسي */
        .main-logo {
            width: 220px;
            height: auto;
            max-width: 85%;
            object-fit: contain;
            mix-blend-mode: screen;
        }

        /* زر التواصل عبر الواتساب */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease;
            width: 100%;
            max-width: 280px;
        }

        .whatsapp-btn:active {
            transform: scale(0.96);
        }

        .whatsapp-icon {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اللوجو -->
        <img src="./logo.png" alt="محمد هشام - محامي" class="main-logo">

        <!-- زر الواتساب -->
        <a href="https://wa.me/201000000000" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
            <svg class="whatsapp-icon" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.754zm6.097-4.901l.438.26c1.511.896 3.25 1.368 5.021 1.369 5.385 0 9.766-4.381 9.768-9.767.001-2.608-1.014-5.059-2.859-6.905-1.846-1.846-4.298-2.86-6.906-2.86-5.386 0-9.767 4.381-9.769 9.768 0 1.838.514 3.63 1.488 5.183l.286.457-1.006 3.677 3.539-.922z"/>
            </svg>
            تواصل عبر الواتساب
        </a>
    </div>

</body>
</html>
